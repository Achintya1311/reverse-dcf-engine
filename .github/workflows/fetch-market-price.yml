name: Refresh market price fixture

# D13 (hub CRITIQUES.md): fixtures/market/GULFOILLUB.csv held a single
# screener.in snapshot from 2026-09-12 with no automated refresh, even
# though scripts/fetch_market_price.py already knows how to re-fetch it
# from the same free, no-login source. This runs it without anyone
# starting it by hand, the same pattern collect-headlines.yml
# (headline-sentiment-vs-price) and fetch-largecaps.yml
# (markowitz-portfolio-optimizer) already use elsewhere in this portfolio.
#
# Triggers once on push of this file or the script itself, so committing
# either one starts the first real fetch with no manual dispatch. The
# weekly schedule keeps the fixture from going stale after that.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-market-price.yml"
      - "scripts/fetch_market_price.py"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The solver's own runtime deps are heavier than this needs -
        # fetch_market_price.py only imports pandas and requests.
        run: pip install pandas requests

      - name: Refresh GULFOILLUB's market price (best effort)
        # screener.in layout drift or a transient fetch error is not a
        # workflow failure - the commit step below is the real pass/fail
        # signal for the day's run.
        run: python scripts/fetch_market_price.py --ticker GULFOILLUB
        continue-on-error: true

      - name: Install the package for the tests
        run: pip install -e ".[dev]"

      - name: Tests on the refreshed fixtures (D47)
        # A push made with GITHUB_TOKEN does not start ci.yml, so this is the
        # only run that sees the new fixtures. Everything except the docs_pin
        # tests must pass: a red run here means the fetched data or the code
        # is broken, and nothing is pushed.
        run: pytest -q -m "not docs_pin"

      - name: Do README.md and REPORT.md still match the fixtures?
        # docs_pin tests pin hand-written README/REPORT numbers to the
        # committed fixtures. Until 5 Nov 2026 this workflow pushed first and
        # tested after, so every price move left main red until someone
        # rewrote the docs (2-4 Nov 2026 runs). Now a fixture that would
        # outdate the docs is held back: the run stays green, says so in a
        # warning and the job summary, and main keeps docs and fixtures in
        # step. Regenerate the docs together with the fixture to land it.
        id: docs
        run: |
          if pytest -q -m docs_pin; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the new price would outdate README.md/REPORT.md (docs_pin tests); not committed. Regenerate the docs with the fixture to land it."
            {
              echo "### Fixture refresh held back"
              echo ""
              echo "The new price would make the hand-written numbers in README.md/REPORT.md stale (\`pytest -m docs_pin\` fails), so nothing was pushed. Fetch locally, update the docs, and commit both together."
              git diff -- fixtures/market
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit if the fixtures changed and the docs still match
        if: steps.docs.outputs.match == 'true'
        run: |
          git config user.name "Achintya1311"
          git config user.email "67464985+Achintya1311@users.noreply.github.com"
          git add fixtures/market
          if git diff --cached --quiet; then
            echo "price unchanged since the last refresh - nothing to commit"
            exit 0
          fi
          git commit -m "data: refresh GULFOILLUB market price ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
