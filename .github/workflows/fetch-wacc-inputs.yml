name: Refresh WACC input fixtures

# D29 (hub CRITIQUES.md): fixtures/wacc/*.csv (India 10Y G-Sec yield,
# Damodaran's country risk premium and industry beta) had not changed since
# Day 3 and nothing ran scripts/fetch_wacc_inputs.py. The yield feeds both
# the cost of equity and the terminal growth rate. FRED and
# pages.stern.nyu.edu are reachable from Actions, so the refresh runs here,
# the same pattern as fetch-market-price.yml.
#
# Triggers once on push of this file or the script itself, so committing
# either one starts the first real fetch with no manual dispatch. FRED
# publishes the yield monthly and Damodaran updates yearly, so a monthly
# schedule is enough.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-wacc-inputs.yml"
      - "scripts/fetch_wacc_inputs.py"
  schedule:
    - cron: "0 5 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # Matches the optional `fetch` extra plus pandas; the solver's own
        # runtime deps are not needed here.
        run: pip install pandas requests xlrd

      - name: Refresh the WACC inputs (best effort)
        # A source layout change or a transient fetch error is not a
        # workflow failure - the commit step below is the real signal.
        run: python scripts/fetch_wacc_inputs.py
        continue-on-error: true

      - name: Install the package for the tests
        run: pip install -e ".[dev]"

      - name: Tests on the refreshed fixtures (D47)
        # A push made with GITHUB_TOKEN does not start ci.yml, so this is the
        # only run that sees the new fixtures. Everything except the docs_pin
        # tests must pass: a red run here means the fetched data or the code
        # is broken, and nothing is pushed.
        run: pytest -q -m "not docs_pin"

      - name: Do README.md and REPORT.md still match the fixtures?
        # docs_pin tests pin hand-written README/REPORT numbers to the
        # committed fixtures. Until 5 Nov 2026 this workflow pushed first and
        # tested after, so every price move left main red until someone
        # rewrote the docs (2-4 Nov 2026 runs). Now a fixture that would
        # outdate the docs is held back: the run stays green, says so in a
        # warning and the job summary, and main keeps docs and fixtures in
        # step. Regenerate the docs together with the fixture to land it.
        id: docs
        run: |
          if pytest -q -m docs_pin; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the new WACC inputs would outdate README.md/REPORT.md (docs_pin tests); not committed. Regenerate the docs with the fixture to land it."
            {
              echo "### Fixture refresh held back"
              echo ""
              echo "The new wacc inputs would make the hand-written numbers in README.md/REPORT.md stale (\`pytest -m docs_pin\` fails), so nothing was pushed. Fetch locally, update the docs, and commit both together."
              git diff -- fixtures/wacc
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit if the fixtures changed and the docs still match
        if: steps.docs.outputs.match == 'true'
        run: |
          git config user.name "Achintya1311"
          git config user.email "67464985+Achintya1311@users.noreply.github.com"
          git add fixtures/wacc
          if git diff --cached --quiet; then
            echo "WACC inputs unchanged since the last refresh - nothing to commit"
            exit 0
          fi
          git commit -m "data: refresh WACC input fixtures ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
