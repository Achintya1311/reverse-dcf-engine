name: Refresh WACC input fixtures

# D29 (hub CRITIQUES.md): fixtures/wacc/*.csv (India 10Y G-Sec yield,
# Damodaran's country risk premium and industry beta) had not changed since
# Day 3 and nothing ran scripts/fetch_wacc_inputs.py. The yield feeds both
# the cost of equity and the terminal growth rate. FRED and
# pages.stern.nyu.edu are reachable from Actions, so the refresh runs here,
# the same pattern as fetch-market-price.yml.
#
# Triggers once on push of this file or the script itself, so committing
# either one starts the first real fetch with no manual dispatch. FRED
# publishes the yield monthly and Damodaran updates yearly, so a monthly
# schedule is enough.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-wacc-inputs.yml"
      - "scripts/fetch_wacc_inputs.py"
  schedule:
    - cron: "0 5 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # Matches the optional `fetch` extra plus pandas; the solver's own
        # runtime deps are not needed here.
        run: pip install pandas requests xlrd

      - name: Refresh the WACC inputs (best effort)
        # A source layout change or a transient fetch error is not a
        # workflow failure - the commit step below is the real signal.
        run: python scripts/fetch_wacc_inputs.py
        continue-on-error: true

      - name: Commit if the inputs changed
        run: |
          git config user.name "Achintya1311"
          git config user.email "67464985+Achintya1311@users.noreply.github.com"
          git add fixtures/wacc
          if git diff --cached --quiet; then
            echo "WACC inputs unchanged since the last refresh - nothing to commit"
            exit 0
          fi
          git commit -m "data: refresh WACC input fixtures ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
