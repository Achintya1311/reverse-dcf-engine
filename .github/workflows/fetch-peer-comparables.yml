name: Refresh peer comparables fixture

# D13 (hub CRITIQUES.md) scoped the market-price refresh
# (fetch-market-price.yml); this extends the same automation to
# fixtures/peers/lubricants.csv, on a slower cadence since the peer
# ranges (10-year CAGR, ROE) move far less often than a daily/weekly
# price. Each row's --ticker/--name/--statement is already known from the
# committed fixture (research/sources.md's standalone-vs-consolidated
# call for each name), so this is four known, explicit CLI calls, the
# same shape as scripts/fetch_market_price.py's own single-ticker call -
# no new per-ticker logic needed to automate it.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-peer-comparables.yml"
      - "scripts/fetch_peer_comparables.py"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install pandas requests

      - name: Refresh each peer's ranges (best effort)
        # Any single ticker's screener.in layout drift or transient fetch
        # error is not a workflow failure - the commit step below is the
        # real pass/fail signal, and each ticker runs independently so one
        # bad fetch doesn't block the others.
        run: |
          python scripts/fetch_peer_comparables.py --ticker GULFOILLUB --name "Gulf Oil Lubricants India" --statement standalone
          python scripts/fetch_peer_comparables.py --ticker CASTROLIND --name "Castrol India" --statement standalone
          python scripts/fetch_peer_comparables.py --ticker SOTL --name "Savita Oil Technologies" --statement standalone
          python scripts/fetch_peer_comparables.py --ticker GANDHAR --name "Gandhar Oil Refinery" --statement consolidated
        continue-on-error: true

      - name: Install the package for the tests
        run: pip install -e ".[dev]"

      - name: Tests on the refreshed fixtures (D47)
        # A push made with GITHUB_TOKEN does not start ci.yml, so this is the
        # only run that sees the new fixtures. Everything except the docs_pin
        # tests must pass: a red run here means the fetched data or the code
        # is broken, and nothing is pushed.
        run: pytest -q -m "not docs_pin"

      - name: Do README.md and REPORT.md still match the fixtures?
        # docs_pin tests pin hand-written README/REPORT numbers to the
        # committed fixtures. Until 5 Nov 2026 this workflow pushed first and
        # tested after, so every price move left main red until someone
        # rewrote the docs (2-4 Nov 2026 runs). Now a fixture that would
        # outdate the docs is held back: the run stays green, says so in a
        # warning and the job summary, and main keeps docs and fixtures in
        # step. Regenerate the docs together with the fixture to land it.
        id: docs
        run: |
          if pytest -q -m docs_pin; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the new peer figures would outdate README.md/REPORT.md (docs_pin tests); not committed. Regenerate the docs with the fixture to land it."
            {
              echo "### Fixture refresh held back"
              echo ""
              echo "The new peer figures would make the hand-written numbers in README.md/REPORT.md stale (\`pytest -m docs_pin\` fails), so nothing was pushed. Fetch locally, update the docs, and commit both together."
              git diff -- fixtures/peers
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit if the fixtures changed and the docs still match
        if: steps.docs.outputs.match == 'true'
        run: |
          git config user.name "Achintya1311"
          git config user.email "67464985+Achintya1311@users.noreply.github.com"
          git add fixtures/peers
          if git diff --cached --quiet; then
            echo "peer figures unchanged since the last refresh - nothing to commit"
            exit 0
          fi
          git commit -m "data: refresh peer comparables fixture ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
