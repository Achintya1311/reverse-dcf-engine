[project]
name = "reverse_dcf"
version = "0.1.0"
description = "Reverse DCF solver: implied growth from a committed market price, GULFOILLUB base case."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reverse_dcf*"]
